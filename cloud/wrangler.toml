# The Melo POS cloud copy . Deploy from this folder: npm run deploy
name = "melobylume"
main = "src/worker.ts"
compatibility_date = "2025-06-01"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "melobylume"
database_id = "79ca62e0-54ca-4eec-8a4b-8b649ca7e402"

# Voice and typed-order help (Cloudflare Workers AI, free within its daily allowance).
[ai]
binding = "AI"
migrations_dir = "migrations"

# The owner's phone page (the cloud build of the app; nothing else of the POS is served here).
[assets]
directory = "../dist-cloud"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/", "/api/*", "/mcp", "/mcp/*", "/.well-known/*", "/admin", "/admin/*", "/owner.webmanifest", "/manager.webmanifest", "/order.webmanifest", "/questions", "/get", "/download"]

# Online ordering stays off: no shop takes orders through this cloud yet (ORDER_SHOP, ORDER_PHONE,
# ORDER_HOURS, ORDER_ADDRESS go under [vars] once one does).

# A test copy of the cloud, apart from the shops' live one: its own address and its own empty
# database. Try changes end to end over the internet before they reach the shops:
#   npm run deploy:staging  →  https://melobylume-staging.cheesybeez-cloud.workers.dev
[env.staging]
name = "melobylume-staging"
workers_dev = true

[[env.staging.d1_databases]]
binding = "DB"
database_name = "melobylume-staging"
database_id = "fac6ec03-aa29-49ca-97b2-56c0c98edd62"
migrations_dir = "migrations"

[env.staging.ai]
binding = "AI"
